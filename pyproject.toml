[project]
name = "resume-growth-coach"
version = "0.1.0"
description = "A local-first AI resume growth coach built with FastAPI, SQLite, and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx2>=2.5.0",
    "playwright>=1.50.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
