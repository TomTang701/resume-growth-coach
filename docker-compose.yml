services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_growth_coach
      POSTGRES_USER: resume_growth_coach
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_growth_coach -d resume_growth_coach"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      RGC_DATABASE_URL: postgresql+psycopg://resume_growth_coach:local-development-only@db:5432/resume_growth_coach
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
